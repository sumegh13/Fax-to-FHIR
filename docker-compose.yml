services:
  # The HAPI image runs as uid 65532; a fresh named volume is root-owned, so hand it over once.
  hapi-volume-init:
    image: alpine:3.20
    command: chown -R 65532:65532 /data/hapi
    volumes:
      - hapi-data:/data/hapi

  hapi:
    image: hapiproject/hapi:latest
    depends_on:
      hapi-volume-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      # Store the database on the volume (the image default is in-memory and loses everything on restart).
      spring.datasource.url: jdbc:h2:file:/data/hapi/h2
      spring.datasource.username: sa
      spring.datasource.password: ""
      spring.datasource.driverClassName: org.h2.Driver
      JAVA_TOOL_OPTIONS: "-Xmx2560m"
    volumes:
      - hapi-data:/data/hapi

  # Review screen, run by Docker so it outlives the shell that starts it (Codespaces uses this;
  # locally, run uvicorn yourself). Reuses the repo's .venv, so the repo is mounted at its own path.
  review:
    image: python:3.11-slim-bookworm
    profiles: [app]
    network_mode: host  # port 8000 on the host; HAPI at localhost:8080
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: ${PWD}
    volumes:
      - .:${PWD}
    command: .venv/bin/uvicorn app.server:app --host 0.0.0.0 --port 8000
volumes:
  hapi-data:
